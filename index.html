<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post de Instagram</title>
    <link rel="stylesheet" type="text/css" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header class="header-fixed bg-white border-bottom">
        <div class="container text-center">
            <h1><i class="fab fa-instagram"></i> Instagram</h1>
        </div>
    </header>

    <main class="container">
        <article class="card">
            <!-- Card Header -->
            <div class="card-header">
                <div class="header-user">
                    <div class="user-info">
                        <h2>Usuario</h2>
                        <span>Angelo</span>
                    </div>
                </div>
                <button class="btn-more">⋯</button>
            </div>

            
            <img src="https://tse4.mm.bing.net/th/id/OIP.E69I70-m5PLf5aU-PRkSlgHaFj?rs=1&pid=ImgDetMain&o=7&rm=3" alt="Paisaje idílico" class="img-full">

            
            <div class="card-actions">
                <button class="btn-icon" title="Me gusta"><i class="far fa-heart"></i></button>
                <button class="btn-icon" title="Comentar"><i class="far fa-comment"></i></button>
                <button class="btn-icon" title="Compartir"><i class="far fa-paper-plane"></i></button>
                <button class="btn-icon btn-bookmark" title="Guardar"><i class="far fa-bookmark"></i></button>
            </div>

         
            <div class="card-body">
                <p class="likes"><strong>Like</strong> Disfrutando de un bonito paisaje <strong> 10.000.000,000</strong></p>
                
                <p class="description">
                    <strong>#nature</strong> Explorando la belleza de la naturaleza #nature #html5 #landscape
                </p>

                <p class="text-gray text-small">Ver los 1000 comentarios</p>
            </div>

        
            <div class="card-footer text-gray">
                <p>publicado a hace 2 horas</p>
            </div>
        </article>
    </main>
</body>
</html>
